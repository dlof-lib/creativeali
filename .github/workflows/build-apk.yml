name: Build Creative Ali APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1536m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Ensure gradlew is executable if present
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Found gradlew and made it executable"
          else
            echo "No gradlew found in repo root"
          fi

      - name: Set up Gradle (install Gradle when wrapper missing)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.4'

      - name: Build APK (use wrapper if present, otherwise system gradle)
        run: |
          if [ -f "./gradlew" ]; then
            echo "Using ./gradlew"
            ./gradlew assembleRelease --no-daemon
          else
            echo "Using gradle from gradle-build-action"
            gradle assembleRelease --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: creativeali-apk
          path: app/build/outputs/**/*.apk
